<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Tanker Register - Radisson Blu Plaza Hotel Mysore</title>
  
  <!-- GitHub & Web Security Content-Security-Policy -->
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self'; 
                 script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; 
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; 
                 font-src 'self' https://fonts.gstatic.com; 
                 img-src 'self' data: blob:; 
                 object-src 'none'; 
                 base-uri 'self';">

  <!-- External PDF Generation Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-navy: #1b365d;
      --secondary-blue: #2b547e;
      --accent-blue: #e8eef5;
      --border-gray: #cbd5e1;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --bg-light: #f8fafc;
      --gold-accent: #d97706;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: var(--text-main);
      padding: 20px;
    }

    /* Container & Printable Page Base */
    .audit-container {
      max-width: 1200px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      padding: 30px;
      position: relative;
    }

    /* Action Toolbar */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: #ffffff;
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid var(--border-gray);
      flex-wrap: wrap;
      gap: 10px;
    }

    .save-status {
      font-size: 13px;
      font-weight: 600;
      color: #059669;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toolbar-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-add {
      background-color: #059669;
      color: #ffffff;
    }

    .btn-add:hover {
      background-color: #047857;
    }

    .btn-pdf {
      background-color: var(--primary-navy);
      color: #ffffff;
      box-shadow: 0 2px 5px rgba(27, 54, 93, 0.2);
    }

    .btn-pdf:hover {
      background-color: #122440;
    }

    .btn-reset {
      background-color: #ef4444;
      color: #ffffff;
    }

    .btn-reset:hover {
      background-color: #dc2626;
    }

    /* Floating Action Button (FAB) */
    .btn-floating-add {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      background-color: #059669;
      color: #ffffff;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(5, 150, 105, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
    }

    .btn-floating-add:hover {
      background-color: #047857;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(5, 150, 105, 0.55);
    }

    .btn-floating-add:active {
      transform: translateY(0);
    }

    /* Header Branding */
    .report-header {
      text-align: center;
      border-bottom: 2px solid var(--primary-navy);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .report-header h1 {
      color: var(--primary-navy);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .report-header h2 {
      color: var(--secondary-blue);
      font-size: 14px;
      font-weight: 600;
      margin-top: 4px;
    }

    /* Metadata Grid */
    .metadata-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      background-color: var(--bg-light);
      padding: 14px;
      border-radius: 6px;
      border: 1px solid var(--border-gray);
      margin-bottom: 20px;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meta-item label {
      font-size: 10px;
      font-weight: 700;
      color: var(--primary-navy);
      text-transform: uppercase;
    }

    .meta-item input, .meta-item select {
      padding: 8px 10px;
      font-size: 12px;
      border: 1px solid var(--border-gray);
      border-radius: 4px;
      background-color: #ffffff;
      color: var(--text-main);
    }

    .meta-item input[readonly] {
      background-color: #e2e8f0;
      cursor: not-allowed;
      font-weight: 700;
      color: #334155;
    }

    /* Dynamic Tanker Entry Cards Container */
    .tanker-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .tanker-card {
      background: #ffffff;
      border: 1px solid var(--border-gray);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .tanker-card-header {
      background-color: var(--primary-navy);
      color: #ffffff;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tanker-card-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-delete-entry {
      background: #ef4444;
      color: #ffffff;
      border: none;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-delete-entry:hover {
      background: #b91c1c;
    }

    .tanker-card-body {
      padding: 16px;
    }

    /* Entry Details Grid */
    .entry-details-grid {
      display: grid;
      grid-template-columns: 1.5fr 1.2fr 1.5fr 1fr 1fr;
      gap: 12px;
      background-color: var(--bg-light);
      padding: 12px;
      border: 1px solid var(--border-gray);
      border-radius: 6px;
      margin-bottom: 16px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-item label {
      font-size: 10px;
      font-weight: 700;
      color: var(--primary-navy);
      text-transform: uppercase;
    }

    .detail-item input {
      padding: 7px 10px;
      font-size: 12px;
      border: 1px solid var(--border-gray);
      border-radius: 4px;
      background: #ffffff;
      width: 100%;
    }

    /* Side-by-Side Photo Verification Pair */
    .entry-photos-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .photo-box {
      border: 1px solid var(--border-gray);
      border-radius: 6px;
      padding: 10px;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .photo-box-header {
      font-size: 11px;
      font-weight: 700;
      color: var(--secondary-blue);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 2px;
    }

    .photo-card-spec {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    /* 4R Standard Postcard Aspect Ratio Frame (3:2) */
    .photo-frame {
      width: 100%;
      aspect-ratio: 3 / 2;
      background-color: #f1f5f9;
      border: 1px dashed #94a3b8;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .photo-placeholder {
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      padding: 6px;
      font-weight: 500;
    }

    .photo-actions {
      margin-top: 8px;
      width: 100%;
    }

    .upload-label {
      display: block;
      width: 100%;
      padding: 8px 0;
      background-color: var(--primary-navy);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .upload-label:hover {
      background-color: #122440;
    }

    .file-input {
      display: none;
    }

    /* Mobile Responsive Adjustments */
    @media (max-width: 768px) {
      body { padding: 10px; }
      .audit-container { padding: 15px; }
      .metadata-grid { grid-template-columns: repeat(2, 1fr); }
      .entry-details-grid { grid-template-columns: repeat(2, 1fr); }
      .entry-photos-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .metadata-grid { grid-template-columns: 1fr; }
      .entry-details-grid { grid-template-columns: 1fr; }
    }

    /* PDF Rendering Enforcements & Page Fit Optimization */
    .pdf-rendering {
      width: 1050px !important;
      max-width: 1050px !important;
      padding: 15px 20px !important;
      background: #ffffff !important;
    }

    .pdf-rendering .action-bar,
    .pdf-rendering .photo-actions,
    .pdf-rendering .upload-label,
    .pdf-rendering .btn-delete-entry,
    .pdf-rendering .btn-floating-add {
      display: none !important;
    }

    .pdf-rendering .report-header {
      padding-bottom: 8px !important;
      margin-bottom: 10px !important;
    }

    .pdf-rendering .report-header h1 {
      font-size: 18px !important;
    }

    .pdf-rendering .report-header h2 {
      font-size: 12px !important;
    }

    .pdf-rendering .metadata-grid {
      grid-template-columns: repeat(2, 1fr) !important;
      padding: 8px 12px !important;
      margin-bottom: 12px !important;
      gap: 8px !important;
    }

    .pdf-rendering .tanker-list {
      gap: 12px !important;
    }

    .pdf-rendering .tanker-card {
      margin-bottom: 0 !important;
    }

    .pdf-rendering .tanker-card-header {
      padding: 6px 12px !important;
    }

    .pdf-rendering .tanker-card-body {
      padding: 10px 12px !important;
    }

    .pdf-rendering .entry-details-grid {
      grid-template-columns: 1.5fr 1.2fr 1.5fr 1fr 1fr !important;
      padding: 8px 10px !important;
      margin-bottom: 10px !important;
      gap: 8px !important;
    }

    .pdf-rendering .entry-photos-grid {
      grid-template-columns: 1fr 1fr !important;
      gap: 12px !important;
    }

    .pdf-rendering .photo-box {
      padding: 6px !important;
    }

    .pdf-rendering .photo-card-spec {
      margin-bottom: 4px !important;
    }

    .pdf-rendering .photo-frame {
      max-height: 240px !important;
    }

    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      body { background: #ffffff; padding: 0; }
      .action-bar, .photo-actions, .btn-delete-entry, .btn-floating-add { display: none !important; }
      .audit-container { box-shadow: none; padding: 0; width: 100%; }
      .photo-frame { border: 1px solid #cbd5e1; }
    }
  </style>
</head>
<body>

  <div class="audit-container" id="reportContent">
    
    <!-- Action Toolbar -->
    <div class="action-bar">
      <div class="save-status" id="saveStatus">
        ✓ Auto-Saved to local storage
      </div>
      <div class="toolbar-buttons">
        <button class="btn btn-add" onclick="addTankerEntry()">➕ Add Tanker Entry</button>
        <button class="btn btn-pdf" onclick="downloadPDF()">📄 Export to PDF</button>
        <button class="btn btn-reset" onclick="resetDraft()">🗑️ Reset Draft</button>
      </div>
    </div>

    <!-- Header Branding -->
    <div class="report-header">
      <h1>Radisson Blu Plaza Hotel Mysore</h1>
      <h2>Water Tanker Register</h2>
    </div>

    <!-- Metadata Grid -->
    <div class="metadata-grid">
      <div class="meta-item">
        <label for="auditDate">Date of Inspection</label>
        <input type="date" id="auditDate" onchange="triggerAutoSave()">
      </div>
      <div class="meta-item">
        <label for="dutyShift">Duty Shift</label>
        <select id="dutyShift" onchange="triggerAutoSave()">
          <option value="Morning Shift">Morning Shift</option>
          <option value="General Shift" selected>General Shift</option>
          <option value="Evening Shift">Evening Shift</option>
          <option value="Night Shift">Night Shift</option>
        </select>
      </div>
    </div>

    <!-- Dynamic Tanker Entries Container -->
    <div class="tanker-list" id="tankerListContainer">
      <!-- Dynamic Tanker Entry Cards will be generated here -->
    </div>

  </div>

  <!-- Floating Add Tanker Button -->
  <button class="btn-floating-add" onclick="addTankerEntry()" title="Add New Tanker Entry">
    ➕ Add Tanker Entry
  </button>

  <script>
    let tankerCount = 0;

    // Initialize & Restore Auto-Save Data
    document.addEventListener('DOMContentLoaded', () => {
      const auditDateInput = document.getElementById('auditDate');
      if (auditDateInput && !auditDateInput.value) {
        auditDateInput.valueAsDate = new Date();
      }

      const hasSavedData = loadSavedDraft();
      if (!hasSavedData) {
        // Default: Add 2 clean Tanker Entries to start
        addTankerEntry();
        addTankerEntry();
      }
    });

    // Add New Dynamic Tanker Entry Card
    function addTankerEntry(savedData = null) {
      tankerCount++;
      const currentId = tankerCount;

      const card = document.createElement('div');
      card.className = 'tanker-card';
      card.id = `tanker-card-${currentId}`;

      card.innerHTML = `
        <div class="tanker-card-header">
          <div class="tanker-card-title">
            <span>🚛</span>
            <span class="tanker-label">Tanker #${currentId}</span>
          </div>
          <button class="btn-delete-entry" onclick="removeTankerEntry(${currentId})">✕ Delete Entry</button>
        </div>
        <div class="tanker-card-body">
          <div class="entry-details-grid">
            <div class="detail-item">
              <label>Vendor / Supplier Name</label>
              <input type="text" id="vendor-${currentId}" placeholder="Enter Vendor Name" oninput="triggerAutoSave()">
            </div>
            <div class="detail-item">
              <label>Vehicle Reg. No.</label>
              <input type="text" id="vehicle-${currentId}" placeholder="e.g. KA-09-AB-1234" oninput="triggerAutoSave()">
            </div>
            <div class="detail-item">
              <label>Person Who Checked</label>
              <input type="text" id="inspector-${currentId}" placeholder="Inspector Name" oninput="triggerAutoSave()">
            </div>
            <div class="detail-item">
              <label>Time-In</label>
              <input type="time" id="timein-${currentId}" onchange="triggerAutoSave()">
            </div>
            <div class="detail-item">
              <label>Time-Out</label>
              <input type="time" id="timeout-${currentId}" onchange="triggerAutoSave()">
            </div>
          </div>

          <div class="entry-photos-grid">
            <div class="photo-box">
              <div class="photo-box-header">Top Water Level (Pre-Unload)</div>
              <div class="photo-card-spec">4R (4" × 6" / 102 × 152 mm)</div>
              <div class="photo-frame">
                <img id="img-p7-${currentId}">
                <div class="photo-placeholder" id="ph-p7-${currentId}">4R Photo Slot<br>(4" × 6" / 102×152 mm)</div>
              </div>
              <div class="photo-actions">
                <label for="file-p7-${currentId}" class="upload-label">📷 Snap Photo</label>
                <input type="file" id="file-p7-${currentId}" class="file-input" accept="image/*" capture="environment" onchange="processImage(this, 'p7', ${currentId})">
              </div>
            </div>

            <div class="photo-box">
              <div class="photo-box-header">Tanker Valve Open (Post-Unload)</div>
              <div class="photo-card-spec">4R (4" × 6" / 102 × 152 mm)</div>
              <div class="photo-frame">
                <img id="img-p8-${currentId}">
                <div class="photo-placeholder" id="ph-p8-${currentId}">4R Photo Slot<br>(4" × 6" / 102×152 mm)</div>
              </div>
              <div class="photo-actions">
                <label for="file-p8-${currentId}" class="upload-label">📷 Snap Photo</label>
                <input type="file" id="file-p8-${currentId}" class="file-input" accept="image/*" capture="environment" onchange="processImage(this, 'p8', ${currentId})">
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('tankerListContainer').appendChild(card);

      if (savedData) {
        if (savedData.vendor) document.getElementById(`vendor-${currentId}`).value = savedData.vendor;
        if (savedData.vehicle) document.getElementById(`vehicle-${currentId}`).value = savedData.vehicle;
        if (savedData.inspector) document.getElementById(`inspector-${currentId}`).value = savedData.inspector;
        if (savedData.timein) document.getElementById(`timein-${currentId}`).value = savedData.timein;
        if (savedData.timeout) document.getElementById(`timeout-${currentId}`).value = savedData.timeout;

        if (savedData.imgP7) {
          const img = document.getElementById(`img-p7-${currentId}`);
          const ph = document.getElementById(`ph-p7-${currentId}`);
          img.src = savedData.imgP7;
          img.style.display = 'block';
          ph.style.display = 'none';
        }

        if (savedData.imgP8) {
          const img = document.getElementById(`img-p8-${currentId}`);
          const ph = document.getElementById(`ph-p8-${currentId}`);
          img.src = savedData.imgP8;
          img.style.display = 'block';
          ph.style.display = 'none';
        }
      }

      updateTankerLabels();
      triggerAutoSave();
    }

    // Remove Tanker Entry Card
    function removeTankerEntry(id) {
      const card = document.getElementById(`tanker-card-${id}`);
      if (card) {
        card.remove();
        updateTankerLabels();
        triggerAutoSave();
      }
    }

    // Renumber Header Labels (Tanker #1, Tanker #2, ...)
    function updateTankerLabels() {
      const cards = document.querySelectorAll('.tanker-card');
      cards.forEach((card, idx) => {
        const label = card.querySelector('.tanker-label');
        if (label) label.textContent = `Tanker #${idx + 1}`;
      });
    }

    // Process Image & Burn Lossless High-Clarity Timestamp Watermark
    function processImage(input, point, tankerId) {
      if (!input.files || !input.files[0]) return;

      const file = input.files[0];
      const reader = new FileReader();

      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          // Optimized 4R Standard (1500x1000 px @ High Density)
          const canvas = document.createElement('canvas');
          canvas.width = 1500;
          canvas.height = 1000;
          const ctx = canvas.getContext('2d');

          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';

          ctx.drawImage(img, 0, 0, 1500, 1000);

          const now = new Date();
          const dateStr = now.toLocaleDateString('en-GB'); // DD/MM/YYYY
          const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });

          // High-Contrast Solid Dark Overlay Bar
          ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
          ctx.fillRect(0, 880, 1500, 120);

          // Accent Gold Border Separator
          ctx.fillStyle = '#FFD700';
          ctx.fillRect(0, 872, 1500, 8);

          // Crisp Timestamp Text
          ctx.fillStyle = '#FFD700';
          ctx.font = 'bold 42px Inter, Arial, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(`DATE: ${dateStr}   |   TIME: ${timeStr}`, 750, 940);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.88);

          const targetImg = document.getElementById(`img-${point}-${tankerId}`);
          const targetPh = document.getElementById(`ph-${point}-${tankerId}`);

          targetImg.src = dataUrl;
          targetImg.style.display = 'block';
          targetPh.style.display = 'none';

          triggerAutoSave();
        };
        img.src = e.target.result;
      };

      reader.readAsDataURL(file);
    }

    // Auto-Save System via localStorage
    function triggerAutoSave() {
      const data = {
        date: document.getElementById('auditDate').value,
        shift: document.getElementById('dutyShift').value,
        entries: []
      };

      const cards = document.querySelectorAll('.tanker-card');
      cards.forEach(card => {
        const id = card.id.replace('tanker-card-', '');
        const entryData = {
          vendor: document.getElementById(`vendor-${id}`)?.value || '',
          vehicle: document.getElementById(`vehicle-${id}`)?.value || '',
          inspector: document.getElementById(`inspector-${id}`)?.value || '',
          timein: document.getElementById(`timein-${id}`)?.value || '',
          timeout: document.getElementById(`timeout-${id}`)?.value || '',
          imgP7: '',
          imgP8: ''
        };

        const imgP7 = document.getElementById(`img-p7-${id}`);
        if (imgP7 && imgP7.src && imgP7.style.display !== 'none') {
          entryData.imgP7 = imgP7.src;
        }

        const imgP8 = document.getElementById(`img-p8-${id}`);
        if (imgP8 && imgP8.src && imgP8.style.display !== 'none') {
          entryData.imgP8 = imgP8.src;
        }

        data.entries.push(entryData);
      });

      try {
        localStorage.setItem('water_tanker_register_draft', JSON.stringify(data));
        const statusEl = document.getElementById('saveStatus');
        if (statusEl) {
          const now = new Date();
          statusEl.textContent = `✓ Auto-Saved at ${now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'})}`;
        }
      } catch(e) {
        console.warn('Storage quota limit reached or localStorage disabled:', e);
      }
    }

    function loadSavedDraft() {
      const savedStr = localStorage.getItem('water_tanker_register_draft');
      if (!savedStr) return false;

      try {
        const data = JSON.parse(savedStr);
        if (data.date) document.getElementById('auditDate').value = data.date;
        if (data.shift) document.getElementById('dutyShift').value = data.shift;

        if (data.entries && data.entries.length > 0) {
          document.getElementById('tankerListContainer').innerHTML = '';
          tankerCount = 0;
          data.entries.forEach(entry => {
            addTankerEntry(entry);
          });
          return true;
        }
      } catch (e) {
        console.error('Failed to parse saved draft:', e);
      }
      return false;
    }

    function resetDraft() {
      if (confirm("Are you sure you want to clear all tanker entries and reset the draft?")) {
        localStorage.removeItem('water_tanker_register_draft');
        location.reload();
      }
    }

    // PDF Export Function (Optimized for Landscape & Email < 10 MB)
    function downloadPDF() {
      const element = document.getElementById('reportContent');
      const dateStr = document.getElementById('auditDate').value || 'Log';

      element.classList.add('pdf-rendering');

      const inputs = element.querySelectorAll('input, select');
      inputs.forEach(input => {
        if (input.tagName === 'SELECT') {
          const selectedOption = input.options[input.selectedIndex];
          if (selectedOption) input.setAttribute('value', selectedOption.text);
        } else {
          input.setAttribute('value', input.value);
        }
      });

      const opt = {
        margin:       [6, 6, 6, 6],
        filename:     `Water_Tanker_Register_${dateStr}.pdf`,
        image:        { type: 'jpeg', quality: 0.92 },
        html2canvas:  { scale: 2, useCORS: true, logging: false, windowWidth: 1050, imageTimeout: 0 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' },
        pagebreak:    { mode: ['css', 'legacy'] }
      };

      const actionBar = document.querySelector('.action-bar');
      if (actionBar) actionBar.style.display = 'none';

      html2pdf().set(opt).from(element).save().then(() => {
        element.classList.remove('pdf-rendering');
        if (actionBar) actionBar.style.display = 'flex';
      }).catch(err => {
        console.error('PDF export error:', err);
        element.classList.remove('pdf-rendering');
        if (actionBar) actionBar.style.display = 'flex';
      });
    }
  </script>
